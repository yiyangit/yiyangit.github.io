    <p>链式前向星+堆优化dijkstra</p>
<figure class="highlight cpp"><table><tbody><tr><td class="code"><pre><span class="line"><span class="function"><span class="type">void</span> <span class="title">add_edge</span><span class="params">(<span class="type">int</span> u,<span class="type">int</span> v,<span class="type">int</span> w)</span></span>{</span><br><span class="line">	to[++_]=v;</span><br><span class="line">	nxt[_]=frm[u];</span><br><span class="line">	frm[u]=_;</span><br><span class="line">	val[_]=w;</span><br><span class="line">}</span><br><span class="line">priority_queue&lt;pair&lt;<span class="type">int</span>,<span class="type">int</span>&gt;,vector&lt;pair&lt;<span class="type">int</span>,<span class="type">int</span>&gt; &gt;,greater&lt;pair&lt;<span class="type">int</span>,<span class="type">int</span>&gt; &gt; &gt; Q;</span><br><span class="line"><span class="type">int</span> vis[N],dis[N];</span><br><span class="line"><span class="function"><span class="type">void</span> <span class="title">dijkstra</span><span class="params">()</span></span>{</span><br><span class="line">	<span class="keyword">while</span>(!Q.<span class="built_in">empty</span>()){</span><br><span class="line">		<span class="type">int</span> u=Q.<span class="built_in">top</span>().second;</span><br><span class="line">		Q.<span class="built_in">pop</span>();</span><br><span class="line">		<span class="keyword">if</span>(vis[u])<span class="keyword">continue</span>;</span><br><span class="line">		vis[u]=<span class="number">1</span>;</span><br><span class="line">		<span class="keyword">for</span>(<span class="type">int</span> i=frm[u];i;i=nxt[i]){</span><br><span class="line">			<span class="keyword">if</span>(dis[to[i]]&gt;dis[u]+val[i]){</span><br><span class="line">				dis[to[i]]=dis[u]+val[i];</span><br><span class="line">				Q.<span class="built_in">push</span>(<span class="built_in">make_pair</span>(dis[to[i]],to[i]));</span><br><span class="line">			}</span><br><span class="line">		}</span><br><span class="line">	}</span><br><span class="line">}</span><br><span class="line"><span class="function"><span class="type">int</span> <span class="title">main</span><span class="params">()</span></span>{</span><br><span class="line">	<span class="keyword">for</span>(<span class="type">int</span> i=<span class="number">1</span>;i&lt;=n;i++){</span><br><span class="line">		dis[i]=INF;</span><br><span class="line">	}</span><br><span class="line">	dis[<span class="number">1</span>]=<span class="number">0</span>;</span><br><span class="line">	Q.<span class="built_in">push</span>(<span class="built_in">make_pair</span>(<span class="number">0</span>,<span class="number">1</span>));</span><br><span class="line">	<span class="built_in">dijkstra</span>();</span><br><span class="line">	<span class="keyword">return</span> <span class="number">0</span>;</span><br><span class="line">}</span><br><span class="line"></span><br></pre></td></tr></tbody></table></figure>
  </div>
